name: ManifestLint

on:
  push:
    paths:
      - "tools/manifestlint/**"
      - ".github/workflows/manifestlint.yml"
  pull_request:
    paths:
      - "tools/manifestlint/**"
      - ".github/workflows/manifestlint.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/manifestlint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test
