name: Lueur
on:
  push:
    paths: ["tools/lueur/**",".github/workflows/lueur.yml"]
  pull_request:
    paths: ["tools/lueur/**",".github/workflows/lueur.yml"]
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/lueur
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - run: npm test